[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "securevault"
dynamic = ["version"]
description = "Offline password manager for Windows and Linux: Argon2id + AES-256-GCM, one encrypted file, no cloud."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shmadhs" }]
requires-python = ">=3.12"
keywords = ["password-manager", "security", "cryptography", "argon2", "aes-gcm", "offline", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
# One runtime dependency, kept deliberately minimal: every dependency is
# supply-chain attack surface. Argon2id needs cryptography 44+.
dependencies = ["cryptography>=44"]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=2.4.1",
    "bandit>=1.7.9",
    "pip-audit>=2.7",
]
build = ["pyinstaller>=6.22.3"]
# The desktop GUI is optional, so the core keeps its single runtime dependency.
# PySide6-Essentials ships QtCore/QtGui/QtWidgets only. The full PySide6 adds the
# Addons wheel (QtWebEngine bundles Chromium), which is size and attack surface
# a password manager does not need.
gui = ["PySide6-Essentials>=6.12.0"]
# Kept out of "dev": pytest-qt aborts the whole pytest run when no Qt binding is
# installed, which would break the core-only test job.
gui-test = ["pytest-qt>=4.4"]

[project.scripts]
svault = "securevault.cli:main"

# A GUI script runs under pythonw on Windows, so no console window appears.
[project.gui-scripts]
svault-gui = "securevault.gui:main"

[project.urls]
Homepage = "https://github.com/Shmadhs/secure_vault_project"
Issues = "https://github.com/Shmadhs/secure_vault_project/issues"

[tool.hatch.version]
path = "src/securevault/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/securevault"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "README.md", "SECURITY.md", "CHANGELOG.md", "LICENSE"]

# --------------------------------------------------------------------------- quality gates

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: tests that run real-cost Argon2id"]

[tool.coverage.run]
source = ["securevault"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "PT", "C4", "RET", "PTH"]
ignore = [
    "PLR0913",  # CLI handlers legitimately take many options
    "PLR2004",  # magic numbers are fine in a crypto/format module with named constants nearby
    "PTH123",   # open() is clearer than Path.open() for the fdopen/os.open patterns used here
    "RUF001",   # the ellipsis and bullet characters in output are intentional
]

[tool.ruff.lint.per-file-ignores]
# Platform-specific imports are deliberately lazy so each OS only loads its own code.
"src/securevault/clipboard.py" = ["PLC0415"]
"src/securevault/osutil.py" = ["PLC0415"]
# The argument-parser builders and the shell loop are long by nature.
"src/securevault/cli.py" = ["PLR0912", "PLR0915"]
# Widget construction and per-error message dispatch are long by nature.
"src/securevault/gui/*.py" = ["PLR0911", "PLR0912", "PLR0915"]
# PySide6 is imported lazily in the launcher so `svault` never loads Qt; the
# Win32 calls for screen-capture exclusion only load on Windows.
"src/securevault/gui/__init__.py" = ["PLC0415"]
"src/securevault/gui/guards.py" = ["PLC0415"]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "S603", "PLC0415"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/securevault"]

[tool.bandit]
exclude_dirs = ["tests"]
