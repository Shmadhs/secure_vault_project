name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The gui extra is installed so mypy type-checks the GUI against the
      # PySide6 stubs (statically: no Qt libraries needed) and pip-audit also
      # covers PySide6.
      - run: python -m pip install --upgrade pip && pip install -e ".[dev,gui]"
      - name: Ruff (lint, incl. bandit rules and Trojan-Source detection)
        run: ruff check src tests
      - name: Ruff (format)
        run: ruff format --check src tests
      - name: Mypy --strict for every target platform
        run: |
          mypy --platform linux
          mypy --platform win32
          mypy --platform darwin
      - name: Bandit
        run: bandit -c pyproject.toml -r src
      - name: Dependency CVE audit
        run: pip-audit --skip-editable

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Core only, deliberately without the gui extra: this proves SecureVault
      # works with its single runtime dependency (tests/gui is not collected).
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term

  gui:
    name: GUI tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    env:
      # Headless Qt: no display server needed.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip && pip install -e ".[dev,gui,gui-test]"
      - run: pytest tests/gui tests/test_gui_optional.py -ra

  linux-clipboard:
    name: Real X11 clipboard round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y xvfb xclip
      - run: pip install -e ".[dev]"
      - name: Clipboard tests under a virtual X server
        env:
          SVAULT_TEST_CLIPBOARD: "1"
        run: xvfb-run -a pytest tests/test_platform.py -k clipboard -v

  package:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/svault --version
          /tmp/wheel-env/bin/svault gen --words 6
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: svault-gui explains the missing extra, then starts with it
        run: |
          set +e
          /tmp/wheel-env/bin/svault-gui 2> missing-extra.txt
          code=$?
          set -e
          test "$code" -eq 1
          grep -F 'pip install "securevault[gui]"' missing-extra.txt
          /tmp/wheel-env/bin/pip install "$(ls dist/*.whl)[gui]"
          /tmp/wheel-env/bin/svault-gui --version
